<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugatti Luxury 3D Showroom</title>

    <!-- Three.js aur GLTFLoader CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030406;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 3D Canvas Container */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #webgl-container:active {
            cursor: grabbing;
        }

        /* Luxury Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(180deg, rgba(3,4,6,0.85) 0%, transparent 100%);
            pointer-events: none;
        }

        .brand-logo {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo h1 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #d4af37;
            letter-spacing: 4px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* UI Overlays & Instructions */
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 5%;
            z-index: 10;
            pointer-events: none;
        }

        .ui-overlay h2 {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            letter-spacing: 2px;
            color: #fff;
        }

        .ui-overlay h2 span {
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        .car-specs {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }

        .click-hint {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            font-size: 12px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030406;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loader p {
            margin-top: 15px;
            color: #d4af37;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
            font-size: 13px;
        }

        /* --- Fullscreen Video Modal --- */
        #videoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #videoModal.active {
            display: flex;
            opacity: 1;
        }

        .video-box {
            position: relative;
            width: 85%;
            max-width: 1100px;
            background: #000;
            border: 2px solid rgba(212, 175, 55, 0.7);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            overflow: hidden;
        }

        .video-box video {
            width: 100%;
            height: auto;
            display: block;
        }

        .close-video-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(3, 4, 6, 0.8);
            border: 1px solid #d4af37;
            color: #d4af37;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
        }

        .close-video-btn:hover {
            background: #d4af37;
            color: #000;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Loading 3D Luxury Showroom...</p>
    </div>

    <!-- Header -->
    <header>
        <div class="brand-logo">
            <i class="fa-solid fa-crown" style="color: #d4af37; font-size: 20px;"></i>
            <h1>BUGATTI</h1>
        </div>
    </header>

    <!-- 3D Canvas -->
    <div id="webgl-container"></div>

    <!-- Car Details Overlay -->
    <div class="ui-overlay">
        <h2 id="carTitle">BUGATTI <span>TOURBILLON</span></h2>
        <p class="car-specs" id="carSpecs">1800 HP • V16 Hybrid • Top Speed 445 km/h</p>
        <div class="click-hint">
            <i class="fa-solid fa-play"></i> 3D Car par click karein cinematic video dekhne ke liye
        </div>
    </div>

    <!-- Fullscreen Video Modal -->
    <div id="videoModal">
        <div class="video-box">
            <button class="close-video-btn" id="closeVideo">&times;</button>
            <video id="carVideoPlayer" controls playsinline>
                <source id="videoSource" src="" type="video/mp4">
                Aapka browser video tag support nahi karta.
            </video>
        </div>
    </div>

    <!-- Main JavaScript Logic -->
    <script>
        // ==========================================
        // 1. JSON / DATA-DRIVEN CAR DATABASE
        // ==========================================
        const carDatabase = {
            id: "bugatti-tourbillon",
            name: "BUGATTI TOURBILLON",
            highlightName: "TOURBILLON",
            specs: "1800 HP • 8.3L V16 Hybrid • 0-100 in 2.0s",
            // 3D Model (.glb / .gltf) - Yahan aap apni Bugatti GLB file ka path de sakte hain
            modelUrl: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/ferrari.glb",
            // 20-Second Cinematic Video clip (.mp4)
            videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            scale: 0.9,
            positionY: -0.1
        };

        // UI Information update
        document.getElementById('carTitle').innerHTML = `BUGATTI <span>${carDatabase.highlightName}</span>`;
        document.getElementById('carSpecs').innerText = carDatabase.specs;

        // ==========================================
        // 2. THREE.JS SCENE SETUP
        // ==========================================
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030406);
        scene.fog = new THREE.FogExp2(0x030406, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        container.appendChild(renderer.domElement);

        // ==========================================
        // 3. SHOWROOM LIGHTING & ENVIRONMENT
        // ==========================================
        // Ambient Light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        // Main Ceiling Studio Light
        const mainSpot = new THREE.SpotLight(0xfff3d6, 4.0);
        mainSpot.position.set(0, 7, 0);
        mainSpot.angle = Math.PI / 3;
        mainSpot.penumbra = 0.8;
        mainSpot.castShadow = true;
        mainSpot.shadow.mapSize.width = 2048;
        mainSpot.shadow.mapSize.height = 2048;
        mainSpot.shadow.bias = -0.0001;
        scene.add(mainSpot);

        // Golden Rim Light (Front)
        const frontKeyLight = new THREE.DirectionalLight(0xd4af37, 2.0);
        frontKeyLight.position.set(4, 3, 5);
        scene.add(frontKeyLight);

        // Cool Cyan Rim Light (Back reflection)
        const backRimLight = new THREE.DirectionalLight(0x4a90e2, 1.8);
        backRimLight.position.set(-5, 4, -4);
        scene.add(backRimLight);

        // ==========================================
        // 4. SHOWROOM ROTATING PODIUM & FLOOR
        // ==========================================
        const carStageGroup = new THREE.Group();
        scene.add(carStageGroup);

        // Reflective Dark Mirror Floor
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x07080b,
            metalness: 0.9,
            roughness: 0.15
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        scene.add(floor);

        // Glowing Golden Podium Rings
        const ringGeo = new THREE.TorusGeometry(2.6, 0.03, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        ringMesh.position.y = 0.01;
        scene.add(ringMesh);

        // ==========================================
        // 5. GLTF LOADER - REALISTIC 3D CAR
        // ==========================================
        let loadedCarModel = null;
        const carMeshesForRaycast = [];

        const gltfLoader = new THREE.GLTFLoader();
        gltfLoader.load(
            carDatabase.modelUrl,
            (gltf) => {
                loadedCarModel = gltf.scene;
                loadedCarModel.scale.set(carDatabase.scale, carDatabase.scale, carDatabase.scale);
                loadedCarModel.position.set(0, carDatabase.positionY, 0);

                // Metallic shaders aur shadow enable karna
                loadedCarModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        carMeshesForRaycast.push(child);

                        // Car paint ko realistic glossy aur reflective banana
                        if (child.material) {
                            child.material.envMapIntensity = 1.5;
                            if (child.material.name.toLowerCase().includes('body') || child.material.name.toLowerCase().includes('paint')) {
                                child.material.metalness = 0.85;
                                child.material.roughness = 0.15;
                                child.material.clearcoat = 1.0;
                                child.material.clearcoatRoughness = 0.05;
                            }
                        }
                    }
                });

                carStageGroup.add(loadedCarModel);

                // Loader hide karein
                const loaderEl = document.getElementById('loader');
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.style.display = 'none', 600);
            },
            (xhr) => {
                // Loading progress
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                if (percent) {
                    document.querySelector('#loader p').innerText = `Loading Bugatti 3D (${percent}%)...`;
                }
            },
            (error) => {
                console.error("GLTF Load Error:", error);
                document.querySelector('#loader p').innerText = "Model loading error!";
            }
        );

        // ==========================================
        // 6. AUTO-ROTATION, MOUSE DRAG & TOUCH CONTROLS
        // (Yeh logic bilkul intact aur smooth rakhi gayi hai)
        // ==========================================
        let isDragging = false;
        let previousPointerX = 0;
        let dragDistance = 0; // Click aur Drag me farq karne ke liye
        let rotationVelocity = 0.004; // Auto-rotation speed

        // Mouse Events
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousPointerX = e.clientX;
            dragDistance = 0;
        });

        window.addEventListener('mouseup', (e) => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousPointerX;
            dragDistance += Math.abs(deltaX);
            carStageGroup.rotation.y += deltaX * 0.008;
            previousPointerX = e.clientX;
        });

        // Touch Events for Mobile
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousPointerX = e.touches[0].clientX;
            dragDistance = 0;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousPointerX;
            dragDistance += Math.abs(deltaX);
            carStageGroup.rotation.y += deltaX * 0.01;
            previousPointerX = e.touches[0].clientX;
        }, { passive: true });

        // ==========================================
        // 7. CLICK TO PLAY 20s CINEMATIC VIDEO MODAL
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const videoModal = document.getElementById('videoModal');
        const videoPlayer = document.getElementById('carVideoPlayer');
        const videoSource = document.getElementById('videoSource');
        const closeVideoBtn = document.getElementById('closeVideo');

        // 3D Car par Click detect karna
        function onCarClick(event) {
            // Agar user ne drag kiya hai toh video open na ho
            if (dragDistance > 5) return;

            const clientX = event.clientX || (event.changedTouches && event.changedTouches[0].clientX);
            const clientY = event.clientY || (event.changedTouches && event.changedTouches[0].clientY);

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(carMeshesForRaycast, true);

            if (intersects.length > 0) {
                // Car click ho gayi! Video play karein
                openCinematicVideo();
            }
        }

        container.addEventListener('click', onCarClick);

        function openCinematicVideo() {
            videoSource.src = carDatabase.videoUrl;
            videoPlayer.load();
            videoModal.classList.add('active');
            videoPlayer.currentTime = 0;
            videoPlayer.play();
        }

        function closeCinematicVideo() {
            videoPlayer.pause();
            videoModal.classList.remove('active');
        }

        closeVideoBtn.addEventListener('click', closeCinematicVideo);

        // Escape key se video band karein
        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeCinematicVideo();
        });

        // Modal ke background par click se band karein
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) closeCinematicVideo();
        });

        // ==========================================
        // 8. ANIMATION LOOP & RESIZE
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Agar user drag nahi kar raha aur video band hai, to smooth auto-rotate karein
            if (!isDragging && !videoModal.classList.contains('active')) {
                carStageGroup.rotation.y += rotationVelocity;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
