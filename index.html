<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Luxury Car Showroom</title>

    <!-- Three.js aur GLTFLoader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #030406;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 3D Canvas Container */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: grab;
            z-index: 1;
        }

        #webgl-container:active {
            cursor: grabbing;
        }

        /* Luxury Header */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 22px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(3,4,6,0.9) 0%, transparent 100%);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            letter-spacing: 4px;
            color: #d4af37;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* Hint Text */
        .hint-text {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 13px;
            color: #d4af37;
            letter-spacing: 1px;
            pointer-events: none;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #030406;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loader p {
            margin-top: 15px;
            color: #d4af37;
            font-size: 13px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loader-text">Loading 3D Car...</p>
    </div>

    <!-- Header -->
    <header>
        <div class="brand-title">LUXURY HYPERCAR</div>
    </header>

    <!-- 3D Canvas Container -->
    <div id="webgl-container"></div>

    <div class="hint-text">360° Rotate ke liye drag ya touch karein</div>

    <script>
        // ==========================================
        // 1. CAR FILE CONFIGURATION
        // ==========================================
        // Agar aapki apni .glb / .gltf file hai toh yahan uska path/link daalein:
        const CAR_MODEL_URL = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@dev/examples/models/gltf/ferrari.glb';
        const CAR_SCALE = 1.0;
        const CAR_POS_Y = 0.0;

        // ==========================================
        // 2. THREE.JS SCENE, CAMERA & RENDERER
        // ==========================================
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030406);
        scene.fog = new THREE.FogExp2(0x030406, 0.035);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Realistic studio lighting & metallic reflections ke liye tone-mapping
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ==========================================
        // 3. SHOWROOM LIGHTING SETUP
        // ==========================================
        // Ambient Light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        // Ceiling Main Studio Spotlight
        const mainSpot = new THREE.SpotLight(0xfff3d6, 4.5);
        mainSpot.position.set(0, 7, 0);
        mainSpot.angle = Math.PI / 3;
        mainSpot.penumbra = 0.8;
        mainSpot.castShadow = true;
        mainSpot.shadow.mapSize.width = 2048;
        mainSpot.shadow.mapSize.height = 2048;
        mainSpot.shadow.bias = -0.0001;
        scene.add(mainSpot);

        // Front Warm Golden Key Light
        const frontKey = new THREE.DirectionalLight(0xd4af37, 2.2);
        frontKey.position.set(4, 3, 5);
        scene.add(frontKey);

        // Back Cool Rim Light (edges aur paint highlight karne ke liye)
        const backRim = new THREE.DirectionalLight(0x4a90e2, 2.0);
        backRim.position.set(-5, 4, -4);
        scene.add(backRim);

        // ==========================================
        // 4. REFLECTIVE SHOWROOM FLOOR & PODIUM
        // ==========================================
        const carStageGroup = new THREE.Group();
        scene.add(carStageGroup);

        // Reflective Dark Mirror Floor
        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x050608,
            metalness: 0.88,
            roughness: 0.15
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        scene.add(floor);

        // Golden Glowing Podium Ring
        const ringGeo = new THREE.TorusGeometry(2.7, 0.03, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        ringMesh.position.y = 0.01;
        scene.add(ringMesh);

        // ==========================================
        // 5. REALISTIC 3D CAR (GLTFLoader)
        // ==========================================
        const loader = new THREE.GLTFLoader();
        const dracoLoader = new THREE.DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');
        loader.setDRACOLoader(dracoLoader);
        loader.load(
            CAR_MODEL_URL,
            (gltf) => {
                const carModel = gltf.scene;
                carModel.scale.set(CAR_SCALE, CAR_SCALE, CAR_SCALE);
                carModel.position.set(0, CAR_POS_Y, 0);

                // Car ke materials ko realistic metallic aur reflective banana
                carModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.material) {
                            child.material.envMapIntensity = 1.5;

                            // Body paint ko glossy clearcoat look dena
                            const matName = (child.material.name || '').toLowerCase();
                            if (matName.includes('body') || matName.includes('paint') || matName.includes('red') || matName.includes('car')) {
                                child.material.metalness = 0.85;
                                child.material.roughness = 0.18;
                                child.material.clearcoat = 1.0;
                                child.material.clearcoatRoughness = 0.05;
                            }
                        }
                    }
                });

                carStageGroup.add(carModel);

                // Loader hide karein
                const loaderEl = document.getElementById('loader');
                loaderEl.style.opacity = '0';
                setTimeout(() => loaderEl.style.display = 'none', 500);
            },
            (xhr) => {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                if (percent) {
                    document.getElementById('loader-text').innerText = `Loading 3D Car (${percent}%)...`;
                }
            },
            (err) => {
                console.error("Model load error:", err);
                document.getElementById('loader-text').innerText = "Model load failed!";
            }
        );

        // ==========================================
        // 6. AUTO-ROTATION, MOUSE DRAG & TOUCH CONTROLS
        // (Yeh logic bilkul intact aur smooth rakhi gayi hai)
        // ==========================================
        let isDragging = false;
        let previousPointerX = 0;
        const autoRotateSpeed = 0.0035; // Slow smooth auto-rotation

        // Mouse Controls
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousPointerX = e.clientX;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousPointerX;
            carStageGroup.rotation.y += deltaX * 0.008;
            previousPointerX = e.clientX;
        });

        // Touch Controls (Mobile)
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousPointerX = e.touches[0].clientX;
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousPointerX;
            carStageGroup.rotation.y += deltaX * 0.01;
            previousPointerX = e.touches[0].clientX;
        }, { passive: true });

        // ==========================================
        // 7. ANIMATION LOOP & RESIZE
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Agar user drag nahi kar raha toh aahista aahista auto-rotate hota rahe
            if (!isDragging) {
                carStageGroup.rotation.y += autoRotateSpeed;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
